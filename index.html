<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wawa Clean</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Wawa Clean</h1>

<p>Service brillant, résultats éclatants.</p>

<a href="#soumission">
    <button>Demander une soumission</button>
</a>

<h2>Nos services</h2>

<p>Nettoyage résidentiel</p>
<p>Nettoyage commercial</p>
<p>Nettoyage de bureaux</p>

<h2 id="soumission">Demandez votre soumission</h2>

<p>Remplissez le formulaire et nous vous contacterons.</p>

<form>
    <label>Nom</label><br>
    <input type="text" placeholder="Votre nom"><br><br>

    <label>Téléphone</label><br>
    <input type="tel" placeholder="Votre numéro"><br><br>

    <label>Courriel</label><br>
    <input type="email" placeholder="Votre courriel"><br><br>

    <label>Type de service</label><br>
    <select>
        <option>Nettoyage résidentiel</option>
        <option>Nettoyage commercial</option>
        <option>Nettoyage de bureaux</option>
    </select><br><br>

    <button type="submit">Envoyer ma demande</button>
</form>

		</body>
		</html>
